spring.datasource.url=jdbc:mysql://localhost:3306/interview_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto

# DataSource Initialization
spring.datasource.initialization-mode=always
# spring.datasource.schema=classpath:schema.sql # Default, so optional unless named differently
spring.jpa.hibernate.ddl-auto=none # Important when using schema.sql
